<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fit – מוצר</title>
  <meta name="theme-color" content="#FFFDFB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <!-- Pinned library version: change on purpose only. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
  <script type="module" src="product.js?v=3"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 15.5V11a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v4.5M3 15.5h18v2.5H3zM6 18v2M18 18v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="wordmark">Fit</span>
    </a>
    <a class="link" href="./">לכל הקטלוג</a>
  </header>

  <main>
    <section class="stage" aria-label="תצוגת הרהיט">
      <model-viewer id="mv"
        alt="תצוגה תלת־ממדית של הרהיט"
        loading="eager" reveal="auto"
        ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
        camera-controls touch-action="pan-y" interaction-prompt="none"
        camera-orbit="-28deg 76deg auto" min-camera-orbit="auto 20deg auto" max-camera-orbit="auto 92deg auto"
        tone-mapping="commerce" environment-image="neutral" exposure="1"
        shadow-intensity="1" shadow-softness="0.9">
        <div slot="ar-button" hidden></div>
        <div slot="progress-bar"></div>
      </model-viewer>
      <div class="chips"><span id="sizeChip" class="chip chip-size" hidden></span></div>
      <div id="loading" class="stage-msg"><span class="spinner"></span></div>
      <div id="missing" class="stage-msg" hidden>
        <p>המוצר הזה לא נמצא.<br>ייתכן שהוא נשמר במכשיר אחר.</p>
      </div>
    </section>

    <div class="product-head">
      <h1 id="title" class="page-title"></h1>
      <p id="dimsText" class="page-sub"></p>
    </div>

    <div class="cta-wrap">
      <button id="arBtn" class="btn-primary" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 0v9m0 0 8-4.5M12 12l-8-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        צפייה בחדר שלי
      </button>
      <p id="arHint" class="hint" hidden>כדי להציב את הרהיט בחדר, פתחו את העמוד הזה בטלפון.</p>
      <p class="hint">הרהיט יופיע על הרצפה בגודל האמיתי. אפשר להזיז ולסובב אותו באצבע.</p>
    </div>
  </main>
</body>
</html>
